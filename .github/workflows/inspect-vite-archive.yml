name: Inspect archived Vite descriptions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-vite-archive.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download archived Vite snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download baribal-vite-archive-v1 --repo "${GITHUB_REPOSITORY}" --pattern vite-archive.zip --dir /tmp
          mkdir -p /tmp/vite-snapshot
          python -m zipfile -e /tmp/vite-archive.zip /tmp/vite-snapshot
      - name: Locate service descriptions
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path("/tmp/vite-snapshot")
          terms = [
              "Бронирование кузова плёнкой",
              "Бронирование кузова пленкой",
              "Бронирование автомобиля защитной пленкой",
              "Бронирование автомобиля защитной плёнкой",
              "Quantum Pro",
              "SunTek",
          ]
          files = [p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".html", ".js", ".jsx", ".ts", ".tsx", ".json", ".vue"}]
          print(f"ARCHIVE FILE COUNT: {len(files)}")
          print("\nFILES UNDER KUZOV:")
          for p in files:
              if "kuzov" in str(p).lower():
                  print(p.relative_to(root))
          print("\nMATCHES:")
          found = 0
          for p in files:
              try:
                  text = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  text = p.read_text(encoding="utf-8", errors="replace")
              lines = text.splitlines()
              hit_lines = [i for i, line in enumerate(lines) if any(term.casefold() in line.casefold() for term in terms)]
              if not hit_lines:
                  continue
              found += 1
              print(f"\n--- FILE: {p.relative_to(root)} ---")
              emitted = set()
              for i in hit_lines:
                  for j in range(max(0, i-2), min(len(lines), i+4)):
                      if j not in emitted:
                          print(f"{j+1}: {lines[j][:1200]}")
                          emitted.add(j)
          print(f"\nFILES WITH MATCHES: {found}")
          PY
