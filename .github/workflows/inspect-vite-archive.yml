name: Inspect archived Vite descriptions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-vite-archive.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download archived Vite snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download baribal-vite-archive-v1 --repo "${GITHUB_REPOSITORY}" --pattern vite-archive.zip --dir /tmp
          mkdir -p /tmp/vite-snapshot
          python -m zipfile -e /tmp/vite-archive.zip /tmp/vite-snapshot
      - name: Locate service descriptions
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path("/tmp/vite-snapshot")
          files = [p for p in root.rglob("*") if p.is_file()]
          print("ARCHIVE CONTENTS:")
          for p in files:
              print(f"{p.relative_to(root)} ({p.stat().st_size} bytes)")

          bundle = root / "vite-archive/assets/index-CMx3FcMX.js"
          text = bundle.read_text(encoding="utf-8")
          terms = [
              "Бронирование кузова",
              "Quantum Pro",
              "SunTek",
              "Другие пленки по выбору",
              "Другие плёнки по выбору",
              "самовосстанавлива",
          ]
          print(f"\nBUNDLE: {bundle.relative_to(root)}")
          print(f"BUNDLE SIZE: {len(text)} characters")
          for term in terms:
              start = 0
              count = 0
              while True:
                  pos = text.casefold().find(term.casefold(), start)
                  if pos < 0:
                      break
                  count += 1
                  if count <= 8:
                      left, right = max(0, pos-900), min(len(text), pos+1500)
                      print(f"\n--- {term!r} occurrence {count}, offset {pos} ---")
                      print(text[left:right])
                  start = pos + len(term)
              if count:
                  print(f"\nTOTAL {term!r}: {count}")
          PY
