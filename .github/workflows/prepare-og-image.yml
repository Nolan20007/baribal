name: Prepare BARIBAL Open Graph JPEG

on:
  push:
    branches: [main]
    paths:
      - "og.png"
      - "maintenance/tools/prepare-og-image.py"
      - ".github/workflows/prepare-og-image.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-og-image
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Create optimized JPEG and synchronize site copy
        run: python maintenance/tools/prepare-og-image.py

      - name: Commit generated OG images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og.jpg plain-site/og.jpg
          if git diff --cached --quiet; then
            echo "OG JPEG files are already up to date."
            exit 0
          fi
          git commit -m "Prepare 1200x630 BARIBAL Open Graph JPEG"
          git push origin main
