name: Localize Creatium assets

on:
  push:
    branches: [main]
    paths:
      - "maintenance/creatium-image-inventory.json"
      - "maintenance/tools/localize-creatium-assets.mjs"
      - ".github/workflows/localize-creatium-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download, verify and deduplicate images
        run: node maintenance/tools/localize-creatium-assets.mjs

      - name: Commit local assets and updated source references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images src/main.js src/styles.css maintenance/creatium-localization-report.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Localize and deduplicate Creatium image assets"
            git push
          fi
