name: Download verified Creatium gallery candidates 61-70

on:
  push:
    branches: [main]
    paths:
      - "maintenance/verified-gallery-batch.json"
      - "maintenance/tools/download-verified-gallery-batch.mjs"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install image validation
        run: npm install --no-save sharp
      - name: Download only explicitly listed gallery originals
        run: node maintenance/tools/download-verified-gallery-batch.mjs
      - name: Upload originals and report for manual review
        uses: actions/upload-artifact@v4
        with:
          name: verified-gallery-candidates-61-70
          path: output/verified-gallery-candidates/
          if-no-files-found: error
          retention-days: 14
