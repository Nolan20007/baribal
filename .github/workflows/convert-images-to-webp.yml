name: Create WebP copies of site photographs

on:
  push:
    branches: [main]
    paths:
      - "maintenance/tools/convert-images-to-webp.mjs"
      - ".github/workflows/convert-images-to-webp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webp-image-conversion
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image processor
        run: npm install --no-save --package-lock=false sharp

      - name: Create WebP copies (quality 80)
        run: node maintenance/tools/convert-images-to-webp.mjs

      - name: Commit WebP copies and conversion report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images maintenance/reports/webp-conversion-report.json
          if git diff --cached --quiet; then
            echo "No new WebP files to commit."
            exit 0
          fi
          git commit -m "Add WebP copies of site photographs"
          git push origin main
