name: Prepare verified Creatium photos for cards 8 and 9

on:
  push:
    branches: [main]
    paths:
      - "maintenance/tools/prepare-creatium-cards-8-9.mjs"

permissions:
  contents: write

jobs:
  prepare-two-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare verified originals in extractor format
        run: node maintenance/tools/prepare-creatium-cards-8-9.mjs
      - name: Normalize images and update gallery index
        run: node maintenance/tools/normalize-creatium-galleries.mjs
      - name: Commit verified photos and index (HTML catalog integration is separate)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/portfolio/galleries maintenance/creatium-gallery-index.json output/creatium-images/cards
          if git diff --cached --quiet; then
            echo "No new verified photos to commit."
          else
            git commit -m "Archive verified photos for portfolio cards 8 and 9"
            git push
          fi
