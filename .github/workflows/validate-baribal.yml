name: Validate BARIBAL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Validate PHP syntax
        run: |
          set -e
          find server -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done

      - name: Validate JavaScript syntax
        run: |
          node --check plain-site/js/main.js
          node --check plain-site/js/reviews.js
          node --check plain-site/js/callback-modal.js
