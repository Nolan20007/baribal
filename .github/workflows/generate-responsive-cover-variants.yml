name: Generate responsive portfolio cover variants

on:
  push:
    branches: [main]
    paths:
      - "maintenance/tools/generate-responsive-cover-variants.mjs"
      - ".github/workflows/generate-responsive-cover-variants.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of covers to process (0 = all)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: responsive-cover-variants
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image processor
        run: npm install --no-save --package-lock=false sharp

      - name: Generate responsive WebP variants
        env:
          RESPONSIVE_LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: node maintenance/tools/generate-responsive-cover-variants.mjs

      - name: Commit generated variants and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add assets/images/pages/foto/responsive maintenance/reports/responsive-cover-variants.json
          if git diff --cached --quiet; then
            echo "No new responsive variants."
            exit 0
          fi
          git commit -m "Generate responsive portfolio cover variants"
          git push origin main
