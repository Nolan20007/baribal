name: Deploy BARIBAL HTML site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Assemble static HTML site
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R plain-site/. dist/
          mkdir -p dist/assets
          cp -R assets/. dist/assets/
          mkdir -p dist/foto
          cp foto/foto.png dist/foto/foto.png
          # Home page paths are one level shallower after publication.
          sed -i 's#../assets/#./assets/#g; s#../foto/#./foto/#g' dist/index.html
          # Internal pages live in one-level subdirectories.
          find dist -mindepth 2 -type f -name '*.html' -exec sed -i 's#../../assets/#../assets/#g; s#../../foto/#../foto/#g' {} +
          # CSS is served from /css/, so assets are one level above it.
          sed -i 's#../../assets/#../assets/#g' dist/css/style.css
          cp dist/index.html dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
