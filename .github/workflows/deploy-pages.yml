name: Deploy BARIBAL HTML site and archived Vite preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js for the archived Vite preview
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install archived Vite dependencies
        run: npm install
      - name: Build the archived Vite preview
        env:
          GITHUB_PAGES: "true"
        run: |
          npx vite build --base=/baribal/vite-archive/ --outDir dist/vite-archive
          for route in kuzov himchistka avtovinil tehnology foto video reviews politika-konfidencialnosti; do
            mkdir -p "dist/vite-archive/$route"
            cp dist/vite-archive/index.html "dist/vite-archive/$route/index.html"
          done
      - name: Assemble the main plain HTML site
        run: |
          mkdir -p dist
          cp -R plain-site/. dist/
          mkdir -p dist/assets
          cp -R assets/. dist/assets/
          mkdir -p dist/foto
          cp foto/foto.png dist/foto/foto.png
          python - <<'PY'
          from pathlib import Path
          root = Path("dist")
          home = root / "index.html"
          home.write_text(home.read_text().replace("../assets/", "./assets/").replace("../foto/", "./foto/"))
          for folder in ("tehnology", "kuzov", "himchistka", "avtovinil", "foto", "video", "reviews", "politika-konfidencialnosti"):
              page = root / folder / "index.html"
              page.write_text(page.read_text().replace("../../assets/", "../assets/").replace("../../foto/", "../foto/"))
          css = root / "css" / "style.css"
          css.write_text(css.read_text().replace("../../assets/", "../assets/"))
          PY
          rm -f dist/README.md
          cp dist/index.html dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
