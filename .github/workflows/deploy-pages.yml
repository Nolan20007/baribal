name: Deploy BARIBAL plain HTML site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Assemble the main plain HTML site
        run: |
          mkdir -p dist
          cp -R plain-site/. dist/
          mkdir -p dist/assets
          cp -R assets/. dist/assets/
          mkdir -p dist/foto
          cp foto/foto.png dist/foto/foto.png
          python - <<'PY'
          from pathlib import Path
          root = Path("dist")
          home = root / "index.html"
          home.write_text(home.read_text().replace("../assets/", "./assets/").replace("../foto/", "./foto/"))
          for folder in ("tehnology", "kuzov", "himchistka", "avtovinil", "foto", "video", "reviews", "politika-konfidencialnosti"):
              page = root / folder / "index.html"
              page.write_text(page.read_text().replace("../../assets/", "../assets/").replace("../../foto/", "../foto/"))
          css = root / "css" / "style.css"
          css.write_text(css.read_text().replace("../../assets/", "../assets/"))
          PY
          rm -f dist/README.md
          cp dist/index.html dist/404.html
      - name: Inject shared callback forms into every page
        run: python maintenance/build-shared-forms.py
      - name: Verify essential published files
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("dist")
          required = [
              "index.html", "404.html", "css/style.css",
              "js/main.js", "js/callback-modal.js",
              "data/work-galleries-1-20.json", "data/work-galleries-21-40.json",
              "data/work-galleries-41-60.json",
              "data/work-galleries-101-120.json", "data/work-galleries-121-140.json",
              "assets", "foto/foto.png",
          ]
          required += [f"{route}/index.html" for route in (
              "tehnology", "kuzov", "himchistka", "avtovinil",
              "foto", "video", "reviews", "politika-konfidencialnosti",
          )]
          missing = []
          for item in required:
              path = root / item
              if not path.exists() or (path.is_file() and path.stat().st_size == 0):
                  missing.append(item)
          if missing:
              raise SystemExit("Missing or empty published files: " + ", ".join(missing))
          print(f"Plain HTML publication check passed: {len(required)} required paths.")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
