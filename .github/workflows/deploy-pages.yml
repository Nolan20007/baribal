name: Deploy BARIBAL HTML site and archived Vite preview to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js for the archived Vite preview
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install archived Vite dependencies
        run: npm install
      - name: Build the archived Vite preview
        env:
          GITHUB_PAGES: "true"
        run: |
          npx vite build --base=/baribal/vite-archive/ --outDir dist/vite-archive
          for route in kuzov himchistka avtovinil tehnology foto video reviews politika-konfidencialnosti; do
            mkdir -p "dist/vite-archive/$route"
            cp dist/vite-archive/index.html "dist/vite-archive/$route/index.html"
          done
      - name: Assemble the main plain HTML site
        run: |
          mkdir -p dist
          cp -R plain-site/. dist/
          mkdir -p dist/assets
          cp -R assets/. dist/assets/
          mkdir -p dist/foto
          cp foto/foto.png dist/foto/foto.png
          python - <<'PY'
          from pathlib import Path
          root = Path("dist")
          home = root / "index.html"
          home.write_text(home.read_text().replace("../assets/", "./assets/").replace("../foto/", "./foto/"))
          for folder in ("tehnology", "kuzov", "himchistka", "avtovinil", "foto", "video", "reviews", "politika-konfidencialnosti"):
              page = root / folder / "index.html"
              page.write_text(page.read_text().replace("../../assets/", "../assets/").replace("../../foto/", "../foto/"))
          css = root / "css" / "style.css"
          css.write_text(css.read_text().replace("../../assets/", "../assets/"))
          PY
          rm -f dist/README.md
          cp dist/index.html dist/404.html
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Smoke-test all pages and interactive controls
        run: |
          mkdir -p /tmp/baribal-preview
          ln -s "$GITHUB_WORKSPACE/dist" /tmp/baribal-preview/baribal
          python3 -m http.server 4173 --directory /tmp/baribal-preview >/tmp/baribal-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/baribal/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const errors = [];
          page.on("pageerror", error => errors.push(page.url() + ": " + error.message));
          const root = "http://127.0.0.1:4173/baribal";
          const routes = ["/", "/tehnology/", "/kuzov/", "/himchistka/", "/avtovinil/", "/foto/", "/video/", "/reviews/", "/politika-konfidencialnosti/"];
          for (const route of routes) {
            const response = await page.goto(root + route, { waitUntil: "domcontentloaded" });
            if (!response || !response.ok()) throw new Error("Page failed: " + route);
            await page.locator(".js-callback").first().click();
            await page.locator("#callback-modal.modal-open").waitFor({ timeout: 4000 });
            if (await page.locator("#callback-modal").getAttribute("aria-hidden") !== "false") throw new Error("Callback modal did not open: " + route);
            const form = page.locator("#callback-modal form");
            const phone = form.locator('input[name="phone"]');
            if (await phone.inputValue() !== "+7") throw new Error("Phone field must start with +7: " + route);
            await phone.fill("+79990000000");
            if (await phone.inputValue() !== "+7 (999) 000-00-00") throw new Error("Phone mask did not format: " + route);
            if (await phone.evaluate(el => el.validity.valid) !== true) throw new Error("Full mobile number rejected: " + route);
            await phone.fill("+73422024142");
            if (await phone.inputValue() !== "+7 (342) 202-41-42") throw new Error("City phone did not format: " + route);
            await phone.fill("+7342202");
            if (await phone.evaluate(el => el.validity.valid) !== true) throw new Error("Short city number rejected: " + route);
            await phone.fill("+73422");
            if (await phone.evaluate(el => el.validity.valid) !== false) throw new Error("Too-short phone accepted: " + route);
            await phone.fill("+799900000001");
            if (await phone.inputValue() !== "+7 (999) 000-00-00") throw new Error("Phone accepted more than 10 digits: " + route);
            await phone.fill("");
            if (await phone.inputValue() !== "+7") throw new Error("Phone prefix was not retained after clearing: " + route);
            await phone.fill("+79990000000");
            await form.locator('button[type="submit"]').click();
            const message = await form.locator("output").textContent();
            if (!message?.includes("Предпросмотр")) throw new Error("Demo form did not submit: " + route);
            await page.locator("#callback-modal .modal-close").click();
            await page.locator("#callback-modal.modal-open").waitFor({ state: "detached", timeout: 1000 }).catch(() => {});
          }
          await page.goto(root + "/tehnology/", { waitUntil: "domcontentloaded" });
          if (!(await page.locator(".estimate-form").count())) throw new Error("Services-page estimate form missing");
          await page.locator('input[name="requestedServices"]').first().check();
          if (!(await page.locator("[data-selected-services]").innerText()).includes("AdVance")) throw new Error("Services-page estimate selection did not sync");
          await page.goto(root + "/", { waitUntil: "domcontentloaded" });
          await page.locator("#works .js-service-info").first().click();
          await page.locator("#service-info-modal.modal-open").waitFor({ timeout: 3000 });
          if (!(await page.locator("#service-info-price").innerText()).includes("от 15 000")) throw new Error("Homepage service details price missing");
          await page.locator("#service-info-modal .modal-close").click();
          await page.locator("#works .work-card .js-callback").first().click();
          if (!(await page.locator("#callback-context").innerText()).includes("Автовинил")) throw new Error("Homepage project callback lost service context");
          await page.locator("#callback-modal .modal-close").click();
          if (!(await page.locator(".video-teaser a[href='./video/']").count())) throw new Error("Homepage video CTA does not link to video page");
          await page.goto(root + "/", { waitUntil: "domcontentloaded" });
          for (const [index, trigger] of (await page.locator("#works .work-image.js-open-work-gallery").all()).entries()) {
            await trigger.click();
            await page.locator("#work-gallery-modal.is-open").waitFor({ timeout: 3000 });
            await page.waitForFunction(() => {
              const image = document.querySelector(".work-gallery-image");
              return image && image.complete && image.naturalWidth > 0;
            }, { timeout: 5000 });
            const counter = await page.locator(".work-gallery-counter").innerText();
            if (!counter.startsWith("1 /")) throw new Error("Homepage gallery did not open at first image: " + index);
            await page.locator(".work-gallery-close").click();
          }
          await page.goto(root + "/foto/", { waitUntil: "domcontentloaded" });
          if (await page.locator("#portfolio-grid .work-card").count() !== 60) throw new Error("Expected all 60 portfolio cards");
          if (await page.locator("#portfolio-grid .work-image.js-open-work-gallery[data-portfolio-gallery-index]").count() !== 60) throw new Error("Expected one gallery cover trigger on each of 60 portfolio cards");
          await page.locator("#portfolio-more").click();
          await page.locator('.work-image.js-open-work-gallery[data-portfolio-gallery-index="9"]').waitFor({ state: "visible" });
          for (let index = 0; index < 60; index++) {
            const trigger = page.locator('.work-image.js-open-work-gallery[data-portfolio-gallery-index="' + index + '"]');
            if (await trigger.count() !== 1) throw new Error("Portfolio cover trigger missing: " + index);
            await trigger.click();
            await page.locator("#work-gallery-modal.is-open").waitFor({ timeout: 3000 });
            const counterText = await page.locator(".work-gallery-counter").innerText();
            const total = Number(counterText.split("/")[1]?.trim());
            if (!counterText.startsWith("1 /") || !Number.isInteger(total) || total < 1) throw new Error("Portfolio gallery failed to open: " + index);
            for (let imageIndex = 0; imageIndex < total; imageIndex++) {
              await page.waitForFunction(() => {
                const image = document.querySelector(".work-gallery-image");
                return image && image.complete && image.naturalWidth > 0;
              }, { timeout: 5000 });
              if (imageIndex + 1 < total) await page.locator("[data-gallery-next]").click();
            }
            await page.locator(".work-gallery-close").click();
          }
          await page.locator('[data-portfolio-gallery-index="0"]').click();
          await page.locator("#work-gallery-modal.is-open").waitFor({ timeout: 3000 });
          await page.locator(".work-gallery-close").click();
          await page.locator("#portfolio-grid .js-service-info").first().click();
          if (!(await page.locator("#service-info-price").innerText()).includes("от 3 000")) throw new Error("Portfolio service details price missing");
          await page.locator("#service-info-modal .modal-close").click();
          await page.locator("#portfolio-grid .js-callback").first().click();
          if (!(await page.locator("#callback-context").innerText()).includes("Бронирование автомобиля защитной плёнкой")) throw new Error("Portfolio callback lost service context");
          await page.locator("#callback-modal .modal-close").click();
          await page.goto(root + "/", { waitUntil: "domcontentloaded" });
          await page.setViewportSize({ width: 390, height: 844 });
          if (await page.locator(".device-preview-open").first().isVisible()) throw new Error("Device preview launcher is visible on mobile");
          await page.setViewportSize({ width: 1440, height: 900 });
          await page.locator(".device-preview-open").first().click();
          await page.locator(".device-preview-modal.is-open").waitFor({ timeout: 3000 });
          await page.locator('[data-preview-width="1366"]').click();
          if (await page.locator(".device-preview-viewport iframe").evaluate(frame => frame.style.width) !== "1366px") throw new Error("Device preview width switch failed");
          await page.locator(".device-preview-close").click();
          await page.goto(root + "/video/", { waitUntil: "domcontentloaded" });
          await page.locator("[data-player-start]").first().click();
          await page.locator(".video-player-status").first().waitFor({ state: "visible", timeout: 5000 });
          for (const route of ["/vite-archive/", "/vite-archive/tehnology/"]) {
            const response = await page.goto(root + route, { waitUntil: "domcontentloaded" });
            if (!response || !response.ok()) throw new Error("Archived Vite route failed: " + route);
            if (!(await page.locator("body").innerText()).includes("BARIBAL")) throw new Error("Archived Vite page content missing: " + route);
          }
          if (errors.length) throw new Error("Browser JavaScript errors:\\n" + errors.join("\\n"));
          await browser.close();
          console.log("BARIBAL browser smoke tests passed: 9 HTML pages, callback forms, desktop preview, video fallback, archived Vite routes.");
          JS
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
