name: Deploy BARIBAL to Timeweb (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeweb-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP and install the mailer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          tools: composer:v2

      - name: Install PHP dependencies and validate server scripts
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php -l server/api/submit.php
          php -l server/api/health.php
          php -l server/lib/lead-store.php
          php -l server/admin/leads.php
          php -l server/admin/reviews.php
          php -l server/admin/review-image.php
          php -l server/admin/index.php
          php -l server/api/review-submit.php
          php -l server/api/reviews.php
          php -l server/api/review-image.php
          php -l server/cron/daily-report.php
          php -r 'if (!extension_loaded("pdo_mysql")) { throw new RuntimeException("pdo_mysql extension is required"); }'
          node --check plain-site/js/main.js
          node --check plain-site/js/reviews.js
          node --check plain-site/js/callback-modal.js

      - name: Assemble the main plain HTML site
        run: |
          mkdir -p dist
          cp -R plain-site/. dist/
          mkdir -p dist/assets
          cp -R assets/. dist/assets/
          mkdir -p dist/api dist/lib dist/admin dist/cron
          cp -R server/api/. dist/api/
          cp -R server/lib/. dist/lib/
          cp -R server/admin/. dist/admin/
          cp -R server/cron/. dist/cron/
          cp -R vendor dist/vendor
          python -m pip install --disable-pip-version-check Pillow CairoSVG
          python maintenance/inject-social-metadata.py
          python maintenance/convert-contact-avatar-lossless.py
          python maintenance/prepare-and-validate-site.py
          rm -f dist/README.md
          cp dist/index.html dist/404.html

      - name: Inject shared callback forms into every page
        run: python maintenance/build-shared-forms.py

      - name: Restore responsive image cache
        uses: actions/cache/restore@v4
        with:
          path: .image-cache
          key: baribal-responsive-images-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            baribal-responsive-images-v1-${{ runner.os }}-

      - name: Generate responsive image variants for all published pages
        run: |
          python maintenance/optimize-published-images.py

      - name: Save responsive image cache
        uses: actions/cache/save@v4
        with:
          path: .image-cache
          key: baribal-responsive-images-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Validate all published pages and local assets
        run: python maintenance/prepare-and-validate-site.py

      - name: Verify essential published files
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("dist")
          required = [
              "index.html", "404.html", "css/style.css",
              "js/main.js", "js/callback-modal.js",
              "data/work-galleries-1-20.json", "data/work-galleries-21-40.json",
              "data/work-galleries-41-60.json",
              "data/work-galleries-101-120.json", "data/work-galleries-121-140.json",
              "assets", "foto/foto.png", "foto/foto.webp", "og.jpg",
              "api/submit.php", "api/health.php", "api/review-submit.php",
              "api/reviews.php", "api/review-image.php", "lib/lead-store.php",
              "admin/index.php", "admin/leads.php", "admin/reviews.php",
              "admin/review-image.php", "cron/daily-report.php",
              "js/reviews.js", "vendor/autoload.php",
              "assets/images/brand/favicon-new.svg",
              "favicon.ico", "favicon-32.png", "favicon-16.png", "apple-touch-icon.png",
          ]
          required += [f"{route}/index.html" for route in (
              "tehnology", "kuzov", "himchistka", "avtovinil", "shumo-vibro-teploizolyaciya", "bariglass", "baritools", "tonirovanie-stekol", "predprodazhnaya-podgotovka", "ruchnaya-polirovka", "remont-sideniy", "polirovka-i-zashchita-far", "baritools", "tonirovanie-stekol", "predprodazhnaya-podgotovka", "ruchnaya-polirovka", "remont-sideniy", "polirovka-i-zashchita-far",
              "foto", "video", "reviews", "politika-konfidencialnosti",
          )]
          missing = []
          for item in required:
              path = root / item
              if not path.exists() or (path.is_file() and path.stat().st_size == 0):
                  missing.append(item)
          if missing:
              raise SystemExit("Missing or empty published files: " + ", ".join(missing))
          print(f"Plain HTML publication check passed: {len(required)} required paths.")
          PY

      - name: Save the ready website as a downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: baribal-timeweb-site
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Check that Timeweb credentials are configured
        env:
          TIMEWEB_FTP_USERNAME: ${{ secrets.TIMEWEB_FTP_USERNAME }}
          TIMEWEB_FTP_PASSWORD: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          TIMEWEB_SMTP_USERNAME: ${{ secrets.TIMEWEB_SMTP_USERNAME }}
          TIMEWEB_SMTP_PASSWORD: ${{ secrets.TIMEWEB_SMTP_PASSWORD }}
          TIMEWEB_DB_HOST: ${{ secrets.TIMEWEB_DB_HOST }}
          TIMEWEB_DB_NAME: ${{ secrets.TIMEWEB_DB_NAME }}
          TIMEWEB_DB_USERNAME: ${{ secrets.TIMEWEB_DB_USERNAME }}
          TIMEWEB_DB_PASSWORD: ${{ secrets.TIMEWEB_DB_PASSWORD }}
          BARIBAL_ADMIN_PASSWORD: ${{ secrets.BARIBAL_ADMIN_PASSWORD }}
        run: |
          test -n "$TIMEWEB_FTP_USERNAME" || (echo "Missing repository secret: TIMEWEB_FTP_USERNAME" && exit 1)
          test -n "$TIMEWEB_FTP_PASSWORD" || (echo "Missing repository secret: TIMEWEB_FTP_PASSWORD" && exit 1)
          test "$TIMEWEB_SMTP_USERNAME" = "zayavki@co376877.tw1.ru" || (echo "TIMEWEB_SMTP_USERNAME must be the exact staging sender mailbox, with no spaces" && exit 1)
          test -n "$TIMEWEB_SMTP_PASSWORD" || (echo "Missing repository secret: TIMEWEB_SMTP_PASSWORD" && exit 1)
          test -n "$TIMEWEB_DB_HOST" || (echo "Missing repository secret: TIMEWEB_DB_HOST" && exit 1)
          test -n "$TIMEWEB_DB_NAME" || (echo "Missing repository secret: TIMEWEB_DB_NAME" && exit 1)
          test -n "$TIMEWEB_DB_USERNAME" || (echo "Missing repository secret: TIMEWEB_DB_USERNAME" && exit 1)
          test -n "$TIMEWEB_DB_PASSWORD" || (echo "Missing repository secret: TIMEWEB_DB_PASSWORD" && exit 1)
          test -n "$BARIBAL_ADMIN_PASSWORD" || (echo "Missing repository secret: BARIBAL_ADMIN_PASSWORD" && exit 1)
          test "${#BARIBAL_ADMIN_PASSWORD}" -ge 16 || (echo "BARIBAL_ADMIN_PASSWORD must contain at least 16 characters" && exit 1)

      - name: Create private SMTP configuration for deployment
        env:
          TIMEWEB_SMTP_USERNAME: ${{ secrets.TIMEWEB_SMTP_USERNAME }}
          TIMEWEB_SMTP_PASSWORD: ${{ secrets.TIMEWEB_SMTP_PASSWORD }}
          TIMEWEB_DB_HOST: ${{ secrets.TIMEWEB_DB_HOST }}
          TIMEWEB_DB_NAME: ${{ secrets.TIMEWEB_DB_NAME }}
          TIMEWEB_DB_USERNAME: ${{ secrets.TIMEWEB_DB_USERNAME }}
          TIMEWEB_DB_PASSWORD: ${{ secrets.TIMEWEB_DB_PASSWORD }}
          BARIBAL_ADMIN_PASSWORD: ${{ secrets.BARIBAL_ADMIN_PASSWORD }}
        run: |
          mkdir -p private-config
          php -r '$config = ["smtp_host" => "smtp.timeweb.ru", "smtp_username" => getenv("TIMEWEB_SMTP_USERNAME"), "smtp_password" => getenv("TIMEWEB_SMTP_PASSWORD"), "recipient" => "info@co376877.tw1.ru", "db_host" => getenv("TIMEWEB_DB_HOST"), "db_name" => getenv("TIMEWEB_DB_NAME"), "db_username" => getenv("TIMEWEB_DB_USERNAME"), "db_password" => getenv("TIMEWEB_DB_PASSWORD"), "admin_password_hash" => password_hash(getenv("BARIBAL_ADMIN_PASSWORD"), PASSWORD_DEFAULT)]; $json = json_encode($config, JSON_THROW_ON_ERROR | JSON_UNESCAPED_SLASHES); if (file_put_contents("private-config/baribal-mail.json", $json, LOCK_EX) === false) { throw new RuntimeException("Could not write private mail configuration"); }'
          chmod 644 private-config/baribal-mail.json
          test -s private-config/baribal-mail.json
          php -r '$config = json_decode(file_get_contents("private-config/baribal-mail.json"), true, 512, JSON_THROW_ON_ERROR); foreach (["smtp_username", "smtp_password", "recipient", "db_host", "db_name", "db_username", "db_password", "admin_password_hash"] as $key) { if (!isset($config[$key]) || !is_string($config[$key]) || trim($config[$key]) === "") { throw new RuntimeException("Missing required private mail configuration field: " . $key); } } echo "Private JSON mail and database configuration validated (values hidden).\n";'

      - name: Deploy private SMTP configuration outside public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: vh480.timeweb.ru
          username: ${{ secrets.TIMEWEB_FTP_USERNAME }}
          password: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./private-config/
          server-dir: ./baribal/baribal-private/
          dangerous-clean-slate: true
          dry-run: false
          timeout: 120000

      - name: Deploy website directly to the additional site's public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: vh480.timeweb.ru
          username: ${{ secrets.TIMEWEB_FTP_USERNAME }}
          password: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ./baribal/public_html/
          dry-run: false
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            cgi-bin/**
