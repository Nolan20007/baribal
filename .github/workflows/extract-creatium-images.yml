name: Extract Creatium page images

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: "Full URL of the Creatium page to scan"
        required: true
        type: string
      extra_image_urls:
        description: "Optional image URLs to test directly, one per line"
        required: false
        type: string
  # Keep the currently targeted BARIBAL gallery fresh without a manual button press.
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out selected workflow branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Extract images
        env:
          PAGE_URL: ${{ github.event.inputs.page_url || 'https://baribal-studio.ru/himchistka' }}
          EXTRA_IMAGE_URLS: ${{ github.event.inputs.extra_image_urls }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node tools/extract-creatium-images.mjs

      - name: Upload images and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creatium-images
          path: output/creatium-images/
          if-no-files-found: warn
          retention-days: 14
