name: Extract Creatium page images

on:
  workflow_dispatch:
  # Keep the currently targeted BARIBAL gallery fresh without a manual button press.
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Extract images
        env:
          PAGE_URL: https://baribal-studio.ru/foto
        run: node maintenance/tools/extract-creatium-images.mjs

      - name: Upload images and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creatium-images
          path: output/creatium-images/
          if-no-files-found: warn
          retention-days: 14
