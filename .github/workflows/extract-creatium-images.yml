name: Extract and archive Creatium galleries

concurrency:
  group: creatium-gallery-extraction
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "maintenance/gallery-batch.json"
  workflow_dispatch:
    inputs:
      start_card:
        description: "First card to process"
        required: true
        default: "1"
      end_card:
        description: "Last card to process"
        required: true
        default: "154"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Choose card range
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_START: ${{ inputs.start_card }}
          INPUT_END: ${{ inputs.end_card }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            CARD_START=$(node -e "console.log(JSON.parse(require('fs').readFileSync('maintenance/gallery-batch.json','utf8')).startCard)")
            CARD_END=$(node -e "console.log(JSON.parse(require('fs').readFileSync('maintenance/gallery-batch.json','utf8')).endCard)")
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CARD_START="$INPUT_START"
            CARD_END="$INPUT_END"
          else
            CARD_START=1
            CARD_END=154
          fi
          echo "CARD_START=$CARD_START" >> "$GITHUB_ENV"
          echo "CARD_END=$CARD_END" >> "$GITHUB_ENV"
          echo "Selected gallery cards: $CARD_START-$CARD_END"

      - name: Start with an empty extraction workspace
        run: rm -rf output/creatium-images

      - name: Extract images from Creatium galleries
        env:
          PAGE_URL: https://baribal-studio.ru/foto
        run: node maintenance/tools/extract-creatium-images.mjs

      - name: Deduplicate and index gallery photos
        run: node maintenance/tools/normalize-creatium-galleries.mjs

      - name: Commit archived gallery assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/portfolio/galleries maintenance/creatium-gallery-index.json
          DELETED_GALLERY_FILES=$(git diff --cached --name-only --diff-filter=D -- assets/images/portfolio/galleries)
          if [ -n "$DELETED_GALLERY_FILES" ]; then
            echo "::error::Refusing to commit gallery image deletions:"
            echo "$DELETED_GALLERY_FILES"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No new gallery assets to commit."
          else
            git commit -m "Archive and deduplicate Creatium project galleries"
            git pull --rebase origin main
            git push
          fi

      - name: Upload raw extraction and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creatium-gallery-source
          path: output/creatium-images/
          if-no-files-found: warn
          retention-days: 14
